<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="BeatMy11 — Build your all-time Test XI">
  <title>BeatMy11</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#141D33"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#070B14"/>
  <ellipse cx="930" cy="220" rx="520" ry="360" fill="url(#glow)"/>

  <!-- Ground strip -->
  <rect x="0" y="478" width="1200" height="152" fill="url(#ground)"/>
  <rect x="0" y="472" width="1200" height="10" fill="#16A34A" opacity="0.85"/>
  <g stroke="#F1F5F9" stroke-width="4" opacity="0.35">
    <line x1="320" y1="482" x2="320" y2="530"/>
    <line x1="600" y1="482" x2="600" y2="530"/>
    <line x1="880" y1="482" x2="880" y2="530"/>
  </g>

  <!-- Ball emblem, right -->
  <circle cx="930" cy="250" r="142" fill="none" stroke="#C9A227" stroke-width="10"/>
  <circle cx="930" cy="250" r="118" fill="#C8102E"/>
  <g fill="none" stroke="#F1F5F9" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 12">
    <path d="M862 168 Q930 250 862 332"/>
    <path d="M998 168 Q930 250 998 332"/>
  </g>

  <!-- Headline -->
  <text x="90" y="272" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"
        font-size="118" font-weight="bold" letter-spacing="2" fill="#F1F5F9">BEATMY<tspan fill="#C9A227">11</tspan></text>
  <text x="94" y="352" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"
        font-size="45" font-weight="normal" fill="#94A3B8">Build your all-time Test XI.</text>

  <!-- Chip -->
  <rect x="90" y="398" width="640" height="62" rx="31" fill="#141D33"
        stroke="#94A3B8" stroke-opacity="0.25" stroke-width="2"/>
  <text x="410" y="439" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"
        font-size="25" font-weight="bold" letter-spacing="3" fill="#F1F5F9">6 SPINS &#183; 5 TESTS &#183; ONE LEGENDARY XI</text>
</svg>
